# Standardized FSPPPO Configuration for Batch Training
# Inherits all shared parameters from IPPO/SPPPO base configuration

# CORE TRAINING PARAMS (inherited from IPPO/SPPPO)
"LR": 2.5e-4
"ANNEAL_LR": True
"NUM_ENVS": 16
"NUM_STEPS": 128
"TOTAL_TIMESTEPS": 1e7          # Full training duration
"UPDATE_EPOCHS": 4
"NUM_MINIBATCHES": 4
"MINIBATCH_SIZE": 512           # NUM_ENVS * NUM_STEPS / NUM_MINIBATCHES = 16 * 128 / 4
"ENT_COEF": 0.01
"SEED": 30
"NUM_SEEDS": 5                  # Reduced for faster batch training

# SHARED ALGORITHM PARAMS (inherited from IPPO/SPPPO)
"GAMMA": 0.99
"GAE_LAMBDA": 0.95
"CLIP_EPS": 0.2
"VF_COEF": 0.5
"MAX_GRAD_NORM": 0.5
"ACTIVATION": "tanh"
"ENV_NAME": "MPE_simple_sumo_v3"
"ENV_KWARGS": {}

# WANDB PARAMS (consistent with IPPO/SPPPO)
"ENTITY": ""
"PROJECT": "jaxmarl-batch-training"
"WANDB_MODE": "disabled"

# STANDARDIZED CHECKPOINT PARAMS (consistent with IPPO/SPPPO)
"CHECKPOINT_FREQ": 100          # Standardized frequency for fair comparison
"SAVE_CHECKPOINT_AT_END": true
"MAX_CHECKPOINTS": 10
"CHECKPOINT_BASE_DIR": "checkpoints"
"RUN_ID": null
"AGENT_ID": "main_agent"

# FSPPPO-SPECIFIC PARAMS (Fictitious Self-Play)
"SELF_PLAY_PROBABILITY": 0.3
"RECENCY_BIAS_ALPHA": 0.6
"OPPONENT_SAMPLING_FREQ": 100   # Must match checkpoint freq for proper opponent sampling
"MAX_CHECKPOINT_AGE": null
