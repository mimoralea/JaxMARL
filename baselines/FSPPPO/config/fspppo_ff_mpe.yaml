# NORMAL TRAINING PARAMS
"LR": 2.5e-4
"ANNEAL_LR": True
"NUM_ENVS": 16
"NUM_STEPS": 128
"TOTAL_TIMESTEPS": 1e8
"UPDATE_EPOCHS": 4
"NUM_MINIBATCHES": 4
"MINIBATCH_SIZE": 512  # NUM_ENVS * NUM_STEPS / NUM_MINIBATCHES = 16 * 128 / 4
"ENT_COEF": 0.01
"SEED": 30
"NUM_SEEDS": 10

# # FAST TRAINING DEBUG
# "LR":            1e-3        # larger step => learns useful signal in few updates
# "ANNEAL_LR":     False       # skip schedule to save compute
# "NUM_ENVS":      4           # fewer parallel sims keeps JAX dispatch light
# "NUM_STEPS":     32          # shorter rollout per update
# "TOTAL_TIMESTEPS": 4096      # ≈32 updates with the above settings
# "UPDATE_EPOCHS": 2           # fewer passes over data
# "NUM_MINIBATCHES": 2         # bigger minibatch, less shuffling overhead
# "ENT_COEF":      0.0         # skip entropy bonus for speed; still explores via ε-greedy init
# "SEED":          0
# "NUM_SEEDS":     3           # one run is enough for quick iteration, three for plots with std

# SAME FOR BOTH
"GAMMA": 0.99
"GAE_LAMBDA": 0.95
"CLIP_EPS": 0.2
"VF_COEF": 0.5
"MAX_GRAD_NORM": 0.5
"ACTIVATION": "tanh"
"ENV_NAME":      "MPE_simple_sumo_v3"
"ENV_KWARGS":    {}

# WandB Params
"ENTITY": ""
"PROJECT": "jaxmarl-mpe"
"WANDB_MODE" : "disabled"

# Checkpoint Management
"CHECKPOINT_FREQ": 250         # Save checkpoint every N training iterations (more frequent than opponent sampling)
"SAVE_CHECKPOINT_AT_END": true # Save final checkpoint at end of training
"MAX_CHECKPOINTS": 10         # Keep last N checkpoints per agent
"CHECKPOINT_BASE_DIR": "checkpoints"  # Base directory for checkpoints
"RUN_ID": null                # Auto-generate if null
"AGENT_ID": "main"           # Agent identifier (standardized)

# Opponent Sampling (Fictitious Self-Play)
"SELF_PLAY_PROBABILITY": 0.3   # Probability of using current agent weights vs historical
"RECENCY_BIAS_ALPHA": 0.6      # Recency bias for historical opponents (0=oldest, 0.5=uniform, 1=newest)
"OPPONENT_SAMPLING_FREQ": 250  # Sample new opponent every N training iterations
"MAX_CHECKPOINT_AGE": null     # Maximum age of checkpoints to consider (null = no limit)