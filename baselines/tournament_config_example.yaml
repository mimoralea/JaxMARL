# Example Tournament Configuration
# This file shows how to configure tournament evaluation for all baseline algorithms
#
# Usage:
#   python -m baselines.tournament_eval --config tournament_config_example.yaml

# Environment configuration
env_name: MPE_simple_sumo_v3
env_kwargs:
  random_spawn: false  # Use fixed starting positions for reproducible results

# Tournament settings
base_seed: 42
num_seeds: 10  # Number of random seeds per matchup for statistical significance

# Scripted baseline opponents to include
scripted_baselines:
  - noop      # No-op agent (stands still)
  - random    # Random action selection
  - seek      # Seeks opponent aggressively
  - dodge     # Avoids opponent defensively  
  - centaur   # Mixed seek/dodge strategy

# Trained agent checkpoints (replace with actual paths from your training runs)
agents:
  # IPPO agents (use main/ directory from standardized structure)
  - IPPO:checkpoints/ippo/run_TIMESTAMP_seed0/main/STEP/
  - IPPO:checkpoints/ippo/run_TIMESTAMP_seed1/main/STEP/
  
  # SPPPO agents (use main/ directory from standardized structure)  
  - SPPPO:checkpoints/spppo/run_TIMESTAMP_seed0/main/STEP/
  - SPPPO:checkpoints/spppo/run_TIMESTAMP_seed1/main/STEP/
  
  # FSPPPO agents (use main/ directory from standardized structure)
  - FSPPPO:checkpoints/fspppo/run_TIMESTAMP_seed0/main/STEP/
  - FSPPPO:checkpoints/fspppo/run_TIMESTAMP_seed1/main/STEP/

# Notes:
# - Replace TIMESTAMP with actual run timestamps (e.g., 20250728_111123)
# - Replace STEP with actual checkpoint step numbers (e.g., 4882.0)
# - Use the standardized checkpoint structure: checkpoints/{algorithm}/run_*_seed*/main/
# - Tournament will run all agents vs all agents + scripted baselines
# - Results saved to CSV for statistical analysis
