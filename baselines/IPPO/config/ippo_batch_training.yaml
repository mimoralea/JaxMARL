# Standardized IPPO Configuration for Batch Training
# Base configuration - all other algorithms inherit shared parameters from this

# CORE TRAINING PARAMS (BASE - inherited by all algorithms)
"LR": 2.5e-4
"ANNEAL_LR": True
"NUM_ENVS": 16
"NUM_STEPS": 128
"TOTAL_TIMESTEPS": 1e7          # Full training duration
"UPDATE_EPOCHS": 4
"NUM_MINIBATCHES": 4
"MINIBATCH_SIZE": 512           # NUM_ENVS * NUM_STEPS / NUM_MINIBATCHES = 16 * 128 / 4
"ENT_COEF": 0.01
"SEED": 30
"NUM_SEEDS": 5                  # Standardized seed count (was 10)

# SHARED ALGORITHM PARAMS (inherited by all algorithms)
"GAMMA": 0.99
"GAE_LAMBDA": 0.95
"CLIP_EPS": 0.2
"VF_COEF": 0.5
"MAX_GRAD_NORM": 0.5
"ACTIVATION": "tanh"
"ENV_NAME": "MPE_simple_sumo_v3"
"ENV_KWARGS": {}

# STANDARDIZED CHECKPOINT PARAMS (consistent across all algorithms)
"CHECKPOINT_FREQ": 100          # Standardized frequency for fair comparison
"SAVE_AT_END": true             # Key expected by IPPO training script
"MAX_CHECKPOINTS": 10
"CHECKPOINT_BASE_DIR": "checkpoints"
"RUN_ID": null
"AGENT_ID": "main_agent"

# WANDB PARAMS (consistent across all algorithms)
"ENTITY": ""
"PROJECT": "jaxmarl-batch-training"
"WANDB_MODE": "disabled"
