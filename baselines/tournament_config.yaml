# Tournament Configuration for Baseline Algorithm Evaluation
# This configuration defines a comprehensive tournament to evaluate IPPO, SPPPO, and FSPPPO
# against each other and against scripted baselines.

# Environment settings
env_name: "MPE_simple_sumo_v3"
env_kwargs:
  random_spawn: true

# Agents to evaluate (specify as ALGORITHM:PATH)
# All algorithms now use unified Orbax checkpoint format
agents:
  # IPPO checkpoints (Orbax directories, one per agent)
  - "IPPO:checkpoints/ippo/run_20250718_233033_seed0/agent_0/4882.0/"
  - "IPPO:checkpoints/ippo/run_20250718_233033_seed0/agent_1/4882.0/"
  - "IPPO:checkpoints/ippo/run_20250718_233033_seed1/agent_0/4882.0/"
  
  # SPPPO checkpoints (Orbax directories)
  - "SPPPO:checkpoints/spppo/run_20250101_120000_seed0/step_001000/"
  - "SPPPO:checkpoints/spppo/run_20250101_120000_seed0/step_002000/"
  
  # FSPPPO checkpoints (Orbax directories)
  - "FSPPPO:checkpoints/fspppo/run_20250101_120000_seed0/main_agent/step_001000/"
  - "FSPPPO:checkpoints/fspppo/run_20250101_120000_seed0/main_agent/step_002000/"
  - "FSPPPO:checkpoints/fspppo/run_20250101_120000_seed1/main_agent/step_001000/"

# Scripted baselines to include
scripted_baselines:
  - "seek"      # Aggressive chasing behavior
  - "centaur"   # Defensive positioning
  - "dodge"     # Predictive evasion
  - "random"    # Random actions
  - "noop"      # Static/no-op behavior

# Tournament settings
num_seeds: 10        # Number of random seeds per matchup
base_seed: 42        # Base random seed

