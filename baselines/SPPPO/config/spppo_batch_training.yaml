# Standardized SPPPO Configuration for Batch Training
# Inherits all shared parameters from IPPO base configuration

# CORE TRAINING PARAMS (inherited from IPPO)
"LR": 2.5e-4
"ANNEAL_LR": True
"NUM_ENVS": 16
"NUM_STEPS": 128
"TOTAL_TIMESTEPS": 1e7          # Full training duration
"UPDATE_EPOCHS": 4
"NUM_MINIBATCHES": 4
"ENT_COEF": 0.01
"SEED": 30
"NUM_SEEDS": 5                  # Reduced for faster batch training

# SHARED ALGORITHM PARAMS (inherited from IPPO)
"GAMMA": 0.99
"GAE_LAMBDA": 0.95
"CLIP_EPS": 0.2
"VF_COEF": 0.5
"MAX_GRAD_NORM": 0.5
"ACTIVATION": "tanh"
"ENV_NAME": "MPE_simple_sumo_v3"
"ENV_KWARGS": {}

# STANDARDIZED CHECKPOINT PARAMS (consistent with IPPO)
"CHECKPOINT_FREQ": 100          # Standardized frequency for fair comparison
"SAVE_AT_END": True
"MAX_CHECKPOINTS_TO_KEEP": 10

# WANDB PARAMS (consistent with IPPO)
"ENTITY": ""
"PROJECT": "jaxmarl-batch-training"
"WANDB_MODE": "disabled"
