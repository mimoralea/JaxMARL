# NORMAL TRAINING PARAMS
"LR": 5.0e-4  # Higher learning rate for faster learning
"ANNEAL_LR": False  # No annealing to maintain high learning rate
"NUM_ENVS": 16
"NUM_STEPS": 128
"TOTAL_TIMESTEPS": 1e8
"NUM_UPDATES": 48828  # Calculated from TOTAL_TIMESTEPS / (NUM_ENVS * NUM_STEPS)
"UPDATE_EPOCHS": 8  # More epochs per update for better learning
"NUM_MINIBATCHES": 4
"ENT_COEF": 0.1  # Much higher entropy coefficient for more exploration
"SEED": 30
"NUM_SEEDS": 10

# # FAST TRAINING DEBUG
# "LR":            1e-3        # larger step => learns useful signal in few updates
# "ANNEAL_LR":     False       # skip schedule to save compute
# "NUM_ENVS":      4           # fewer parallel sims keeps JAX dispatch light
# "NUM_STEPS":     32          # shorter rollout per update
# "TOTAL_TIMESTEPS": 4096      # ≈32 updates with the above settings
# "UPDATE_EPOCHS": 2           # fewer passes over data
# "NUM_MINIBATCHES": 2         # bigger minibatch, less shuffling overhead
# "ENT_COEF":      0.0         # skip entropy bonus for speed; still explores via ε-greedy init
# "SEED":          0
# "NUM_SEEDS":     3           # one run is enough for quick iteration, three for plots with std

# SAME FOR BOTH
"GAMMA": 0.99
"GAE_LAMBDA": 0.95
"CLIP_EPS": 0.2
"VF_COEF": 0.5
"MAX_GRAD_NORM": 0.5
"ACTIVATION": "tanh"
"ENV_NAME":      "MPE_simple_sumo_v3"
"ENV_KWARGS":    {}

# Checkpoint Params (end-only for speed)
"SAVE_AT_END": True             # Save final checkpoint
"MAX_CHECKPOINTS_TO_KEEP": 10   # Keep N most recent checkpoints (None = keep all)

# BR Opponent Configuration
"TARGET_ALGORITHM": "ippo"  # Target algorithm to train against: ippo, spppo, or fspppo
"OPPONENT_CHECKPOINT_PATH": ""  # Path to opponent checkpoint (optional, auto-discovered if empty)
"RUN_NAME": "br_training"  # Run name for this BR training

# WandB Params
"ENTITY": ""
"PROJECT": "jaxmarl-br"
"WANDB_MODE" : "disabled"